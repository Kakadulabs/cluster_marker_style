name: cluster_marker_style
description: >-
  Beautiful, count-aware, cached cluster marker icons for Google Maps. A
  drop-in styling/rendering layer for any map clustering algorithm.
version: 0.4.0
homepage: https://www.kakadulabs.com
repository: https://github.com/Kakadulabs/cluster_marker_style/tree/main/packages/cluster_marker_style
issue_tracker: https://github.com/Kakadulabs/cluster_marker_style/issues

screenshots:
  - description: The soft, flat and outlined styles across counts, on light and dark backgrounds.
    path: doc/named_styles.png

topics:
  - maps
  - google-maps
  - markers
  - clustering

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Only needed for the BitmapDescriptor type. Clustering-package adapters are
  # published separately (cluster_marker_style_gmcm, cluster_marker_style_fluster)
  # so this package never forces a clustering dependency on you.
  google_maps_flutter: ">=2.9.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <6.0.0"

flutter:
