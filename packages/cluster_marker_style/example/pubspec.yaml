name: cluster_marker_style_example
description: "Demo of the cluster_marker_style package."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # The packages being demonstrated: the core plus one adapter per clustering
  # package used below.
  cluster_marker_style:
    path: ../
  cluster_marker_style_gmcm:
    path: ../../cluster_marker_style_gmcm
  cluster_marker_style_fluster:
    path: ../../cluster_marker_style_fluster

  # A clustering algorithm + the map widget. The package styles the icons; it
  # does not do the clustering or own the map.
  google_maps_flutter: ">=2.9.0 <3.0.0"
  google_maps_cluster_manager_2: ">=3.0.0 <4.0.0"
  # Alternative clustering algorithm demonstrated in lib/fluster_example.dart.
  fluster: ">=1.2.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <6.0.0"

flutter:
  uses-material-design: true

# The adapters depend on the published cluster_marker_style; point them at the
# local core too so the example always runs against this checkout.
dependency_overrides:
  cluster_marker_style:
    path: ../
