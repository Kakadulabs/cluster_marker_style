name: cluster_marker_style_gmcm
description: >-
  One-line, cached, count-aware cluster icons for google_maps_cluster_manager_2,
  powered by cluster_marker_style.
version: 0.1.0
homepage: https://www.kakadulabs.com
repository: https://github.com/Kakadulabs/cluster_marker_style/tree/main/packages/cluster_marker_style_gmcm
issue_tracker: https://github.com/Kakadulabs/cluster_marker_style/issues

topics:
  - maps
  - google-maps
  - markers
  - clustering

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cluster_marker_style: ^0.4.0
  google_maps_flutter: ">=2.9.0 <3.0.0"
  google_maps_cluster_manager_2: ">=3.0.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <6.0.0"
