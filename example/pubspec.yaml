name: cluster_marker_style_example
description: "Demo of the cluster_marker_style package."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # The package being demonstrated.
  cluster_marker_style:
    path: ../

  # A clustering algorithm + the map widget. The package styles the icons; it
  # does not do the clustering or own the map.
  google_maps_flutter: ">=2.9.0 <3.0.0"
  google_maps_cluster_manager_2: ">=3.0.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <6.0.0"

flutter:
  uses-material-design: true
